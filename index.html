<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>
</head>

<body style="background:#180d18;color:white;text-align:center;font-family:Arial;padding:60px 20px">

<h1>❤️ Для тебя</h1>

<p style="font-size:20px">
Я хотел сказать тебе кое-что важное.
</p>

<button onclick="document.getElementById('text').style.display='block';this.style.display='none'"
style="padding:15px 25px;border:0;border-radius:30px;font-size:17px">
Открой меня
</button>

<p id="text" style="display:none;font-size:19px;line-height:1.7">
За эти годы было многое.<br><br>
Я многое переосмыслил и понял, что одних слов недостаточно.
Я хочу показывать всё своими поступками.<br><br>
Ты очень важна для меня. ❤️
</p>

</body>
</html>
